# ------------------------------------------------------------------------------------------------
# JevTicketRouter
#
# Fast path — Mock mode, no setup, works offline:
#
#   docker compose up --build
#   → http://localhost:8080
#
# With TypeSafe Jev:
#
#   AI_PROVIDER=Jev TYPESAFE_API_KEY=<your-key> docker compose up --build
#
# With circuit, the open-weights System One model, served from this file (no key, nothing leaves
# the machine; first run downloads ~3.5 GB of weights into a volume):
#
#   AI_PROVIDER=SelfHosted docker compose --profile circuit up --build
#
# Same thing without the download or a GPU, for showing the wiring in seconds. The stub answers
# from keyword rules, not a model — a test fixture, never anything real:
#
#   AI_PROVIDER=SelfHosted docker compose --profile circuit-stub up --build
#
# With a local model, started by this file (pulls it automatically, first run downloads several GB):
#
#   AI_PROVIDER=Local LOCAL_AI_MODEL=qwen2.5:7b-instruct \
#     docker compose --profile local up --build
#
# With Ollama already installed on your own machine (Windows, macOS, Linux):
#
#   AI_PROVIDER=Local LOCAL_AI_MODEL=qwen2.5:7b-instruct \
#     LOCAL_AI_BASE_URL=http://host.docker.internal:11434/v1 \
#     docker compose up --build
#
#   ... and start Ollama with OLLAMA_HOST=0.0.0.0 so it accepts connections from the container.
#
# Secrets are never written into this file. Put them in a .env beside it (copy .env.example);
# Compose loads it automatically, and .env is already git-ignored.
# ------------------------------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jevticketrouter:latest
    container_name: jevticketrouter
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Which engine decides: Jev | SelfHosted | Local | Mock.
      # Mock by default so a bare `docker compose up` works with nothing configured.
      AI_PROVIDER: "${AI_PROVIDER:-Mock}"

      # Cloud provider. Empty means Mock mode, whatever AI_PROVIDER says.
      TYPESAFE_API_KEY: "${TYPESAFE_API_KEY:-}"

      # Self-hosted provider. Both the `circuit` and `circuit-stub` profiles answer on this name:
      # the stub joins the network under the alias `circuit`, because from the application's side
      # the only difference is which process is listening. Point this at a server of your own —
      # including one on your machine, at http://host.docker.internal:8901 — to use that instead.
      SELF_HOSTED_BASE_URL: "${SELF_HOSTED_BASE_URL:-http://circuit:8901}"
      SELF_HOSTED_MODEL: "${CIRCUIT_MODEL:-circuit-1.7b}"
      # circuit wants the bearer header present but ignores the value unless it was started with
      # S1_API_KEY. The placeholder keeps the header well-formed; set both to a real secret to
      # require one.
      SELF_HOSTED_API_KEY: "${SELF_HOSTED_API_KEY:-x}"
      # Loading the base model is slow, and the first ticket after start waits for it.
      SelfHosted__TimeoutSeconds: "${SELF_HOSTED_TIMEOUT:-300}"

      # Local provider. Two situations, and the right URL differs:
      #
      #   Ollama started by this file (--profile local)  ->  http://ollama:11434/v1  (the default)
      #   Ollama installed on your own machine           ->  http://host.docker.internal:11434/v1
      #
      # Inside a container `localhost` is the container itself, never your machine, so a host
      # install is not reachable that way. The host install must also listen on all interfaces
      # (set OLLAMA_HOST=0.0.0.0), because Ollama binds to 127.0.0.1 by default.
      LOCAL_AI_BASE_URL: "${LOCAL_AI_BASE_URL:-http://ollama:11434/v1}"
      LOCAL_AI_MODEL: "${LOCAL_AI_MODEL:-}"
      LOCAL_AI_API_KEY: "${LOCAL_AI_API_KEY:-}"

      # A local model is much slower than a hosted API, especially on first load.
      LocalAi__TimeoutSeconds: "${LOCAL_AI_TIMEOUT:-180}"

      # Confidence below this escalates a ticket to a human.
      Triage__MinimumConfidence: "${TRIAGE_MIN_CONFIDENCE:-0.75}"

      ASPNETCORE_ENVIRONMENT: "Production"
    restart: unless-stopped
    # Docker Desktop provides host.docker.internal already; this line adds it on plain Linux, so
    # pointing at a model server on the host works the same way everywhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ----------------------------------------------------------------------------------------------
  # `--profile circuit`: the real self-hosted System One server.
  #
  # Open weights, no API key, no outbound call once the weights are cached. CPU by default, so it
  # starts on any machine; see tools/circuit/README.md for the CUDA build and the GPU lines below.
  # ----------------------------------------------------------------------------------------------
  circuit:
    build:
      context: ./tools/circuit
      dockerfile: Dockerfile
      args:
        # CPU wheels by default. For an NVIDIA card use the ordinary index, whose torch wheels
        # bundle CUDA: TORCH_INDEX_URL=https://pypi.org/simple
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}"
    image: jevticketrouter-circuit:latest
    container_name: jevticketrouter-circuit
    profiles: ["circuit"]
    ports:
      # Published so the server can be probed directly; the application reaches it over the
      # compose network and does not need this.
      - "${CIRCUIT_PORT:-8901}:8901"
    environment:
      # circuit-1.7b or circuit-8b. The small one scores 0.897 on circuit's own validation split
      # against the large one's 0.899, and needs 3.5 GB instead of 16.6 GB, so it is the default.
      CIRCUIT_MODEL: "${CIRCUIT_MODEL:-circuit-1.7b}"
      # Empty means any non-empty bearer token is accepted, which is what a private network needs.
      # To require a real one, set CIRCUIT_API_KEY and SELF_HOSTED_API_KEY to the same value.
      S1_API_KEY: "${CIRCUIT_API_KEY:-}"

      # Where the weights are fetched from, for the one boot that downloads them. Point this at a
      # mirror where huggingface.co is unreachable. Never empty: huggingface_hub reads it as
      # os.getenv("HF_ENDPOINT", default), so an empty value would replace the default with nothing.
      HF_ENDPOINT: "${HF_ENDPOINT:-https://huggingface.co}"

      # For a network that only reaches the internet through a proxy. Empty is the same as unset.
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    volumes:
      # The run and the base model both live here, so they are downloaded once rather than on
      # every `docker compose up`. Set CIRCUIT_WEIGHTS to a host path to use a folder you can see
      # instead of a named volume -- which is how weights downloaded elsewhere get in, on a machine
      # where the container itself cannot reach the Hub.
      - "${CIRCUIT_WEIGHTS:-circuit-weights}:/weights"
    # Docker's own resolver, when the embedded one cannot forward to an upstream. Unset, and Compose
    # leaves the setting out entirely, so the default behaviour is untouched.
    dns: ${CIRCUIT_DNS:-}
    restart: unless-stopped
    # Uncomment to hand an NVIDIA card to the container. Needs the NVIDIA Container Toolkit on the
    # host, and an image built with the CUDA wheels (TORCH_INDEX_URL above).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: ["gpu"]

  # ----------------------------------------------------------------------------------------------
  # `--profile circuit-stub`: the same contract, answered by keyword rules.
  #
  # A TEST FIXTURE, not a model. It makes the SelfHosted path demonstrable in seconds on a machine
  # that cannot run the weights. Never point anything real at it. Enable this profile or `circuit`,
  # not both: they share the network name `circuit`.
  # ----------------------------------------------------------------------------------------------
  circuit-stub:
    build:
      context: ./tools/circuit-stub
      dockerfile: Dockerfile
    image: jevticketrouter-circuit-stub:latest
    container_name: jevticketrouter-circuit-stub
    profiles: ["circuit-stub"]
    ports:
      - "${CIRCUIT_PORT:-8901}:8901"
    networks:
      default:
        # So SELF_HOSTED_BASE_URL needs no change between the two profiles. `docker compose ps`
        # and the container's own startup banner say which one is actually serving.
        aliases: ["circuit"]
    restart: unless-stopped

  # Everything below only starts with `--profile local`. A plain `docker compose up` ignores it,
  # so the default path stays small and quick.
  ollama:
    image: ollama/ollama:latest
    container_name: jevticketrouter-ollama
    profiles: ["local"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Named volume, so a pulled model survives `docker compose down` instead of downloading again.
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Pulls the model once, then exits. Without this the model server starts empty and the first
  # ticket fails with "no model named ...", which is a confusing way to begin.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: jevticketrouter-ollama-pull
    profiles: ["local"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c", "ollama pull \"${LOCAL_AI_MODEL:-qwen2.5:7b-instruct}\""]
    restart: "no"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
  # ~3.5 GB for circuit-1.7b, ~16.6 GB for circuit-8b. `docker compose down` keeps it;
  # `docker compose down -v` throws it away and the next start downloads again.
  circuit-weights:
